d after reload</text><path d="M125,200H485" stroke="#18324B" stroke-width="2" marker-end="url(#arrow)"/><text x="137" y="190" font-family="Arial, sans-serif" font-size="26" fill="#18324B" font-weight="normal">heartbeat(holdId) every 10 s</text><path d="M485,270H885" stroke="#18324B" stroke-width="2" marker-end="url(#arrow)"/><text x="497" y="260" font-family="Arial, sans-serif" font-size="26" fill="#18324B" font-weight="normal">heartbeat(userId, holdId)</text><path d="M885,340H125" stroke="#18324B" stroke-width="2" marker-end="url(#arrow)"/><text x="137" y="330" font-family="Arial, sans-serif" font-size="26" fill="#18324B" font-weight="normal">state, fixed expiresAt, fresh serverNow</text><rect x="5" y="387" width="1765" height="50" rx="0" fill="#F1F5F9" stroke="#B2C0CE" stroke-width="2"/><text x="25" y="420" font-family="Arial, sans-serif" font-size="23" fill="#18324B" font-weight="bold">alt  tab closure / disconnection: no heartbeat for 30 s</text><path d="M1300,495H885" stroke="#18324B" stroke-width="2" marker-end="url(#arrow)"/><text x="897" y="485" font-family="Arial, sans-serif" font-size="26" fill="#18324B" font-weight="normal">releaseAbandonedHolds(now)</text><path d="M885,565H1650" stroke="#18324B" stroke-width="2" marker-end="url(#arrow)"/><text x="897" y="555" font-family="Arial, sans-serif" font-size="26" fill="#18324B" font-weight="normal">lock; recheck absence; release all held rows</text><path d="M1650,635H885" stroke="#18324B" stroke-width="2" marker-end="url(#arrow)"/><text x="897" y="625" font-family="Arial, sans-serif" font-size="26" fill="#18324B" font-weight="normal">RELEASED / pending release + retry</text><rect x="5" y="682" width="1765" height="50" rx="0" fill="#F1F5F9" stroke="#B2C0CE" stroke-width="2"/><text x="25" y="715" font-family="Arial, sans-serif" font-size="23" fill="#18324B" font-weight="bold">else  unknown presence (for example process restart), or fixed expiry reached</text><path d="M1300,790H885" stroke="#18324B" stroke-width="2" marker-end="url(#arrow)"/><text x="897" y="780" font-family="Arial, sans-serif" font-size="26" fill="#18324B" font-weight="normal">releaseExpiredHolds(now)</text><path d="M885,860H1650" stroke="#18324B" stroke-width="2" marker-end="url(#arrow)"/><text x="897" y="850" font-family="Arial, sans-serif" font-size="26" fill="#18324B" font-weight="normal">mark EXPIRED; release rows or retry</text><rect x="5" y="907" width="1765" height="50" rx="0" fill="#F1F5F9" stroke="#B2C0CE" stroke-width="2"/><text x="25" y="940" font-family="Arial, sans-serif" font-size="23" fill="#18324B" font-weight="bold">Polling / explicit cancellation</text><path d="M125,1005H485" stroke="#18324B" stroke-width="2" marker-end="url(#arrow)"/><text x="137" y="995" font-family="Arial, sans-serif" font-size="26" fill="#18324B" font-weight="normal">getActiveHold / releaseHold</text><path d="M485,1075H885" stroke="#18324B" stroke-width="2" marker-end="url(#arrow)"/><text x="497" y="1065" font-family="Arial, sans-serif" font-size="26" fill="#18324B" font-weight="normal">getActiveHold / releaseHold</text><path d="M885,1145H125" stroke="#18324B" stroke-width="2" marker-end="url(#arrow)"/><text x="137" y="1135" font-family="Arial, sans-serif" font-size="26" fill="#18324B" font-weight="normal">Releasing / ReleaseFailed / Released</text></svg>